<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="renderer" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Window-target" content="_top" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>

  <!-- class="root"：UnoCSS important 作用域（生成 `.root :is(.utility)`），见 apps/admin/uno.config.ts -->
  <body class="root">
    <noscript>禁用javascript会导致部分功能不可用</noscript>
    <div id="root">
      <div class="page-loading-wrapper"></div>
    </div>
  </body>
</html>
