# 所有第三方包，发布至少1天才能装
minimumReleaseAge: 1440
# 白名单立即安装
minimumReleaseAgeExclude:
  - typescript
  - eslint
# `pnpm prune` 安装时清理锁文件 prune 的时候，不要重新审查 exclude 里面的包。
minimumReleaseAgeExcludePrune: true

# 启用 shell 模拟，避免在 Windows 上使用 PowerShell 时的错误
shellEmulator: true

# 禁用降级依赖
trustPolicy: no-downgrade
# trustPolicy 白名单：semver@6.3.1 发布于 provenance 普及之前，属合法旧包，
# eslint-plugin-react-hooks v7 经 @babel/core 间接依赖它
trustPolicyExclude:
  - semver@6.3.1

packages:
  - 'apps/*'
  - 'packages/*'

# 统一依赖版本：catalog 作为单一真相源，所有包通过 "catalog:" 引用，
# 避免 Monorepo 内多版本漂移。升级依赖只需改这一处。
catalog:
  '@antfu/eslint-config': ^9.5.0
  '@eslint-react/eslint-plugin': ^5.6.0
  '@nestjs/cli': ^12.0.0
  '@nestjs/common': ^12.0.1
  '@nestjs/config': ^12.0.1
  '@nestjs/core': ^12.0.1
  '@nestjs/platform-express': ^12.0.1
  '@nestjs/schematics': ^12.0.0
  '@nestjs/swagger': ^12.0.2
  '@nestjs/testing': ^12.0.1
  '@nestjs-cls/transactional': ^4.0.1
  '@nestjs-cls/transactional-adapter-prisma': ^2.0.1
  # Prisma 三件套必须同版本锁定。选 7.9.1 而非 7.10.0 的原因：
  # 7.10.0 的 `prisma` CLI 包缺少 npm provenance（client/adapter 有），
  # 会触发本仓库 trustPolicy: no-downgrade 的高风险供应链告警；7.9.1 三件套均具备 provenance。
  '@prisma/adapter-mariadb': 7.9.1
  '@prisma/client': 7.9.1
  '@types/cookie-parser': ^1.4.5
  '@types/express': ^5.0.0
  '@types/node': ^24.0.0
  '@types/supertest': ^7.0.0
  '@vitest/coverage-v8': ^4.1.2
  class-transformer: ^0.5.1
  class-validator: ^0.15.0
  cookie-parser: ^1.4.5
  es-toolkit: ^1.52.0
  eslint: ^10.4.0
  eslint-plugin-format: ^2.0.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.0
  joi: ^18.2.9
  nestjs-cls: ^7.0.1
  nestjs-pino: ^5.3.1
  pino: ^10.4.0
  pino-http: ^11.0.0
  pino-pretty: ^13.1.3
  pino-roll: ^4.0.0
  prisma: 7.9.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1
  source-map-support: ^0.5.21
  supertest: ^7.0.0
  turbo: ^2.11.7
  typescript: ^6.0.3
  vite: ^8.0.0
  vitest: ^4.1.2
  '@keyv/redis': ^5.1.6
  cache-manager: ^7.2.9
  '@nestjs/cache-manager': ^12.0.1
  keyv: ^5.6.0
  '@nestjs/throttler': ^6.7.1
  '@nestjs/terminus': ^12.1.0

