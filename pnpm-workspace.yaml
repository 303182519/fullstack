# 所有第三方包，发布至少1天才能装
minimumReleaseAge: 1440
# `pnpm prune` 安装时清理锁文件 prune 的时候，不要重新审查 exclude 里面的包。
minimumReleaseAgeExcludePrune: true

# 白名单立即安装
minimumReleaseAgeExclude:
  - typescript
  - eslint
  # rslib/rsbuild 1.0 生态 2026-09-03 GA 后 patch 版本密集发布，每次都等 1 天阻塞
  - '@rslib/core'
  - '@rsbuild/core'
  - 'rsbuild-plugin-dts'
# 禁用降级依赖
trustPolicy: no-downgrade
# trustPolicy 白名单：semver@6.3.1 发布于 provenance 普及之前，属合法旧包，
# eslint-plugin-react-hooks v7 经 @babel/core 间接依赖它
trustPolicyExclude:
  - semver@6.3.1

# seroval / seroval-plugins 1.7.2（2026-10-24 发布）改由维护者个人 npm 账号直发，
# 丢失 GitHub Actions OIDC 可信发布 provenance（1.7.0/1.7.1 均有），疑似供应链风险。
# 固定到最后可信版本 1.7.1；待上游恢复 provenance 发布后再解除。
overrides:
  seroval: 1.7.1
  seroval-plugins: 1.7.1

# 启用 shell 模拟，避免在 Windows 上使用 PowerShell 时的错误
shellEmulator: true

packages:
  - 'apps/*'
  # packages 按运行时层分组（shared/node/web/tooling，见 ADR-015），glob 匹配层目录下的包
  - 'packages/*/*'

# 统一依赖版本：catalog 作为单一真相源，所有包通过 "catalog:" 引用，
# 避免 Monorepo 内多版本漂移。升级依赖只需改这一处。
#
# 分组纪律（按 ADR-015 运行时层划分，一个依赖只有一个归属）：
#   0 跨层工具链：任何层都可能使用的工具与通用库
#   1 shared 层：packages/shared/*（零环境依赖）
#   2 node 层：apps/api、apps/admin-api、packages/node/*
#   3 web 层：apps/admin、apps/game、packages/web/*
# 组内排序：@scope 包在前、非 scope 包在后，各自按字母序。
# peer 依赖不单独分组：与运行时依赖共用同一条目，在包级 package.json 中声明。
catalog:
  # ════════════════ 0. 跨层工具链（全 workspace，任何层可用）════════════════

  # ── 0.1 语言与类型 ──
  '@types/node': ^24.0.0
  typescript: ^6.0.3

  # ── 0.2 任务编排与构建（vite 同时是 vitest 的构建底座）──
  turbo: ^2.11.7
  vite: ^8.0.0

  # ── 0.3 Lint（@fedstack/eslint-config 统一入口；react 规则集供 admin 启用）──
  '@antfu/eslint-config': ^9.5.0
  '@eslint-react/eslint-plugin': ^5.6.0
  '@tanstack/eslint-plugin-query': ^5.105.0
  eslint: ^10.4.0
  eslint-plugin-format: ^2.0.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.0

  # ── 0.4 测试 ──
  '@vitest/coverage-v8': ^4.1.2
  vitest: ^4.1.2
  '@testing-library/react': ^16.3.2
  '@testing-library/jest-dom': ^6.9.1

  # ── 0.5 通用工具库 ──
  defu: ^6.1.7
  es-toolkit: ^1.52.0
  # shared 层 @fedstack/utils 使用；node/web 层同样可用，故归入跨层组
  nanoid: ^6.0.2

  # ════════════════ 1. shared 层（packages/shared/*）════════════════
  # 零环境依赖；新增前先确认是否真属 shared 层。
  # @fedstack/utils 的运行时依赖：全部为纯 JS 实现，无 Node 内置模块 / DOM 全局依赖
  '@types/crypto-js': ^4.2.2
  clsx: ^2.1.1
  crypto-js: ^4.2.0
  dayjs: ^1.11.19
  klona: ^2.0.6
  radash: ^12.1.1
  tailwind-merge: ^3.4.0

  # ════════════════ 2. node 层（apps/api、apps/admin-api、packages/node/*）════════════════

  # ── 2.1 NestJS 运行时 ──
  '@nestjs/common': ^12.0.1
  '@nestjs/config': ^12.0.1
  '@nestjs/core': ^12.0.1
  '@nestjs/platform-express': ^12.0.1
  class-transformer: ^0.5.1
  class-validator: ^0.15.0
  cookie-parser: ^1.4.5
  joi: ^18.2.9
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1
  source-map-support: ^0.5.21

  # ── 2.2 NestJS 工程化与测试（仅 devDependencies）──
  '@nestjs/cli': ^12.0.0
  '@nestjs/schematics': ^12.0.0
  '@nestjs/testing': ^12.0.1
  '@types/cookie-parser': ^1.4.5
  '@types/express': ^5.0.0
  # multer 运行时类型；与 multer 本体 v2.x 配套
  '@types/multer': ^2.3.0
  '@types/supertest': ^7.0.0
  supertest: ^7.0.0

  # ── 2.3 API 契约 ──
  '@nestjs/swagger': ^12.0.2

  # ── 2.4 数据访问（ADR-006）──
  '@nestjs-cls/transactional': ^4.0.1
  '@nestjs-cls/transactional-adapter-prisma': ^2.0.1
  # Prisma 三件套必须同版本锁定。选 7.9.1 而非 7.10.0 的原因：
  # 7.10.0 的 `prisma` CLI 包缺少 npm provenance（client/adapter 有），
  # 会触发本仓库 trustPolicy: no-downgrade 的高风险供应链告警；7.9.1 三件套均具备 provenance。
  '@prisma/adapter-mariadb': 7.9.1
  '@prisma/client': 7.9.1
  nestjs-cls: ^7.0.1
  prisma: 7.9.1

  # ── 2.5 缓存与队列（ADR-003 / ADR-013）──
  '@keyv/redis': ^5.1.6
  '@nestjs/bullmq': ^12.0.0
  '@nestjs/cache-manager': ^12.0.1
  bullmq: ^6.3.16
  cache-manager: ^7.2.9
  ioredis: ^6.0.0
  keyv: ^5.6.0

  # ── 2.6 认证与安全 ──
  '@nestjs/jwt': ^12.0.3
  '@nestjs/throttler': ^6.7.1
  argon2: ^0.45.1
  otpauth: ^9.4.0
  svg-captcha: ^1.4.0

  # ── 2.7 可观测 ──
  '@nestjs/terminus': ^12.1.0
  nestjs-pino: ^5.3.1
  pino: ^10.4.0
  pino-http: ^11.0.0
  pino-pretty: ^13.1.3
  pino-roll: ^4.0.0

  # ── 2.8 文件存储（ADR-012 §6.10：S3 兼容驱动 + 预签名直连 + 图片归一化）──
  '@aws-sdk/client-s3': ^3.1152.0
  '@aws-sdk/s3-request-presigner': ^3.1152.0
  # 文件上传运行时：@nestjs/platform-express 提供 FileInterceptor 装饰器，
  # 但 memoryStorage 等存储引擎由 multer 本体暴露；v2 修复 DoS 漏洞（Express 2025 安全公告）
  multer: ^2.4.0
  # sharp 为原生依赖（同 argon2 类别）：预编译二进制，无容器化构建时无额外适配面
  sharp: ^0.35.5

  # ── 2.9 消息通知（ADR-013 D7/D10）──
  # nodemailer v10 自带 d.ts，无需 @types/nodemailer
  nodemailer: ^10.1.7

  # ════════════════ 3. web 层（apps/admin、apps/game、packages/web/*，ADR-015）════════════════

  # ── 3.1 React 运行时与类型 ──
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  'react-error-boundary': ^6.1.6

  # ── 3.2 样式框架与 UI 组件库（Tailwind CSS 4 / antd）──
  antd: ^6.6.8
  tailwindcss: ^4.3.3

  # ── 3.3 HTTP 客户端（@fedstack/axios）──
  '@types/qs': ^6.15.1
  axios: ^1.20.0
  axios-retry: ^4.5.0
  qs: ^6.16.1

  # ── 3.4 请求基础设施（@fedstack/service）──
  '@tanstack/react-query': ^5.104.5
  '@types/node-forge': ^1.3.14
  node-forge: ^1.4.0

  # ── 3.5 日志（@fedstack/logger）──
  '@loglayer/transport': ^3.3.0
  # RN 端存储依赖：logger 包 optional peer + dev 双轨（peer 写版本范围，dev 走 catalog）
  '@react-native-async-storage/async-storage': ^3.0.2
  # fake-indexeddb 仅测试使用（真测 WebStorageAdapter 的 IndexedDB 行为）
  fake-indexeddb: ^6.2.6
  idb: ^8.0.4
  loglayer: ^9.4.0
  serialize-error: ^13.0.2

  # ── 3.6 构建（rslib + rsbuild，web 层专用）──
  '@rsbuild/core': ^2.2.14
  '@rsbuild/plugin-react': ^2.1.1
  '@rslib/core': ^1.0.4
  # TanStack Router 构建期插件（Rspack/Rsbuild 集成 + 路由树代码生成）
  '@tanstack/router-plugin': ^1.168.48
  # Rsbuild polyfill: 'usage' 注入时按需引入，需显式安装
  'core-js': ^3.40.0

  # ── 3.7 测试（msw v2+，与 fetch adapter 配合绕过 axios http adapter 兼容性问题）──
  # happy-dom 仅测试使用：web-utils 用例直接操作 document / window / localStorage
  happy-dom: ^21.0.4
  msw: ^3.0.3

  # ── 3.8 浏览器工具（@fedstack/web-utils）──
  localforage: ^1.10.0

  # ── 3.9 路由与客户端状态（TanStack Router / Zustand）──
  '@tanstack/react-router': ^1.168.48
  zustand: ^5.0.5
